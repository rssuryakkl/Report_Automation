name: Daily Report Automated Dispatcher

on:
  schedule:
    # 7:00 PM IST is 13:30 UTC (Monday to Saturday)
    - cron: '30 13 * * 1-6'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Report Dispatcher
        env:
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          CC_RECIPIENTS: ${{ secrets.CC_RECIPIENTS }}
          APPLICANT: ${{ secrets.APPLICANT }}
          REPORTING_MANAGER: ${{ secrets.REPORTING_MANAGER }}
          MENTOR: ${{ secrets.MENTOR }}
          MODULE: ${{ secrets.MODULE }}
          PROJECT_MANAGER: ${{ secrets.PROJECT_MANAGER }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python send_today_report.py
